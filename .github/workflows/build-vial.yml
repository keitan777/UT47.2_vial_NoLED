name: Build Vial firmware

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Vial-QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          path: vial-qmk
          submodules: recursive

      - name: Overlay UT472 NoLED keyboard
        run: |
          rm -rf vial-qmk/keyboards/keyhive/ut472_noled
          mkdir -p vial-qmk/keyboards/keyhive
          cp -R keyboards/keyhive/ut472_noled vial-qmk/keyboards/keyhive/ut472_noled

      - name: Build Vial firmware
        working-directory: vial-qmk
        run: |
          make keyhive/ut472_noled:vial

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ut472_noled-vial-firmware
          path: |
            vial-qmk/.build/keyhive_ut472_noled_vial.hex
          if-no-files-found: error

      - name: Firmware size
        working-directory: vial-qmk
        run: |
          avr-size .build/keyhive_ut472_noled_vial.elf
